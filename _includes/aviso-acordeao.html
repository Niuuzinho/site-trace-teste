{%- comment -%} Aviso como item de acordeão: botão com o título e painel com resumo e link. Parâmetros: aviso, indice. {%- endcomment -%}
{%- assign a = include.aviso -%}
<li class="in-ac-item">
  <div class="in-ac-card">
    <h3 class="in-ac-h"><button type="button" class="in-ac-btn" aria-expanded="true" aria-controls="ac-p-{{ include.indice }}" id="ac-b-{{ include.indice }}"><span class="in-ac-ic" aria-hidden="true"><svg class="icone" focusable="false"><use href="#i-sobre"></use></svg></span><span class="in-ac-tit">{{ a.title }}</span></button></h3>
    <div class="in-ac-painel" id="ac-p-{{ include.indice }}" role="region" aria-labelledby="ac-b-{{ include.indice }}">
      <p class="in-ac-data">{{ a.data | date: "%d/%m/%Y" }}</p>
      {%- if a.resumo %}<p class="in-ac-resumo">{{ a.resumo }}</p>{% endif %}
      <a class="in-ac-link" href="{{ a.url | relative_url }}">Ler o aviso<span class="so-leitor">: {{ a.title }}</span></a>
    </div>
  </div>
</li>
