{%- comment -%} Aviso como cartão branco com a data em etiqueta. Parâmetro: aviso. {%- endcomment -%}
{%- assign a = include.aviso -%}
<li class="in-av">
  <a class="in-av-link" href="{{ a.url | relative_url }}">
    <span class="in-av-data"><span class="so-leitor">Data </span>{{ a.data | date: "%d/%m/%Y" }}</span>
    <span class="in-av-titulo">{{ a.title }}</span>
    {%- if a.resumo %}<span class="in-av-resumo">{{ a.resumo }}</span>{% endif %}
  </a>
</li>
